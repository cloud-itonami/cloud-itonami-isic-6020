name: CI

# This project's top-level deps.edn pins langgraph via a public :git/sha
# (which itself pins langchain the same way, so a bare checkout can
# resolve it over the network). The :dev alias additionally re-pins
# both langgraph and langchain via in-monorepo :local/root paths
# (../../kotoba-lang/langgraph, .../langchain) for offline
# monorepo-internal dev -- this repo's own existing
# regenerate.yml workflow already uses that :dev + sibling-checkout
# pattern (clojure -M:dev:render-html), so the test job here mirrors
# it for consistency: check out both siblings (all PUBLIC) into the
# expected relative paths and run through :dev -- no token needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: clojure -M:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: orgs/cloud-itonami/cloud-itonami-isic-6020 }
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langgraph
          path: orgs/kotoba-lang/langgraph
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langchain
          path: orgs/kotoba-lang/langchain
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - name: test (governor · advisor · phase · store contract, real compiled StateGraph end-to-end)
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6020
        run: clojure -M:dev:test
      - name: demo runner (compiled StateGraph, end-to-end)
        working-directory: orgs/cloud-itonami/cloud-itonami-isic-6020
        run: clojure -M:dev:run
